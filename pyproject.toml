[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logerr"
version = "0.2.1"
description = "Rust-like Option and Result types with automatic logging integration"
authors = [{name = "Jesse Robertson", email = "jess.robertson@niwa.co.nz"}]
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["rust", "option", "result", "logging", "error-handling", "functional"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "loguru>=0.7.3,<0.8",
    "confection>=0.1.5,<0.2"
]

[project.optional-dependencies]
retry = [
    "tenacity>=9.1.2,<10"
]
tables = [
    "pymongo>=4.0.0,<5",
    "pandas>=2.0.0,<3"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["logerr*"]

[tool.setuptools.package-data]
logerr = ["*.pyi", "py.typed"]
"logerr.recipes" = ["*.pyi"]

[project.urls]
Homepage = "https://github.com/jesserobertson/logerr"
Documentation = "https://jesserobertson.github.io/logerr/"
Repository = "https://github.com/jesserobertson/logerr"
Issues = "https://github.com/jesserobertson/logerr/issues"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
logerr = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
loguru = ">=0.7.3,<0.8"
confection = ">=0.1.5,<0.2"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-cov = ">=6.2.1,<7"
pytest-xdist = "*"
hypothesis = "*"
mypy = "*"
ruff = "*"
pre-commit = ">=4.2.0,<5"
python-build = ">=1.2.2.post1,<2"
twine = ">=6.1.0,<7"
tenacity = ">=9.1.2,<10"
rich = "*"
typer = "*"

[tool.pixi.feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"
mkdocstrings = "*"
mkdocstrings-python = "*"

[tool.pixi.feature.retry.dependencies]
tenacity = ">=9.1.2,<10"

[tool.pixi.feature.tables.dependencies]
pymongo = ">=4.0.0,<5"
pandas = ">=2.0.0,<3"

[tool.pixi.feature.py313.dependencies]
python = ">=3.13,<3.14"

[tool.pixi.environments]
default = ["dev", "docs"]
dev = ["dev", "retry", "tables"]
dev-py313 = ["dev", "retry", "tables", "py313"]
docs = ["docs"]
retry = ["retry", "dev"]
tables = ["tables", "dev"]

[tool.pixi.tasks]
quality = { cmd = "python scripts/quality.py", description = "Code quality management (linting, formatting, type checking)" }
dev = { cmd = "python scripts/dev.py", description = "Development environment management (setup, status, clean)" }
build = { cmd = "python scripts/build.py", description = "Build and distribution management (packaging, uploading)" }
docs = { cmd = "python scripts/docs.py", description = "Documentation management (serve, build, deploy)" }
test = { cmd = "python scripts/test.py", description = "Testing management (unit, integration, docs)" }
check-version-sync = { cmd = "python scripts/check_version_sync.py", description = "Check version is consistent across pyproject.toml and logerr/__init__.py" }
clean = { cmd = "python scripts/test.py clean && python scripts/docs.py clean && python scripts/build.py clean && python scripts/dev.py clean", description = "Clean all project artifacts (test, docs, build, dev)" }
check-all = { cmd = "python scripts/test.py all && python scripts/quality.py check && python scripts/check_version_sync.py", description = "Run comprehensive checks (all tests + quality + version sync)" }
