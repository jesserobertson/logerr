# Pre-commit hooks to mirror CI checks
repos:
  - repo: local
    hooks:
      # Run all checks (test, typecheck, quality, version sync) - same as CI.
      # No separate ruff/mypy hooks here: check-all already runs them, and
      # always_run: true means adding them again would just double the work
      # on every commit.
      - id: check-all
        name: Run all checks (test, typecheck, quality, version sync)
        entry: pixi run -e dev check-all
        language: system
        always_run: true
        pass_filenames: false

      # Manual-stage convenience: run just the tests without the full
      # check-all overhead, e.g. `pre-commit run pytest --hook-stage manual`
      - id: pytest
        name: Run tests
        entry: pixi run -e dev pytest tests/ --doctest-modules logerr
        language: system
        pass_filenames: false
        stages: [manual]  # Only run manually to avoid slowing down commits