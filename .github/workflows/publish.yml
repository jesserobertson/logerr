name: Publish to PyPI

# SCAFFOLDED BUT NOT YET FUNCTIONAL.
#
# This workflow will fail if run right now: it uses PyPI's trusted
# publishing (OIDC), which requires configuring this repo + workflow as a
# trusted publisher on the PyPI project page first
# (https://pypi.org/manage/project/logerr/settings/publishing/, or
# https://pypi.org/manage/account/publishing/ before the project exists on
# PyPI). There is no API token secret configured as a fallback, by design -
# don't add one without discussing it first.
#
# Deliberately manual-trigger only (workflow_dispatch) for now, not
# triggered by tag pushes - review the built artifacts before ever running
# this, and only wire up a tag trigger once a real release process is
# wanted.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target repository"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.8.1
      with:
        environments: dev

    - name: Install dependencies
      run: pixi install --environment dev

    - name: Run full checks
      run: pixi run -e dev check-all

    - name: Build package
      run: pixi run -e dev build package

    - name: Check package
      run: pixi run -e dev build check

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository }}
    permissions:
      id-token: write # required for PyPI trusted publishing

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to TestPyPI
      if: inputs.repository == 'testpypi'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/

    - name: Publish to PyPI
      if: inputs.repository == 'pypi'
      uses: pypa/gh-action-pypi-publish@release/v1
