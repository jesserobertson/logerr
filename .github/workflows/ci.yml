name: CI

# This workflow runs on the jesserobertson/logerr repository

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Windows runners default console encoding to cp1252, which can't encode
  # the emoji rich prints in scripts/test.py's panels (crashes with
  # UnicodeEncodeError). Force UTF-8 everywhere for consistency.
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Quality (lint, format, typecheck)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.1
      with:
        environments: dev

    - name: Install dependencies
      run: pixi install --environment dev

    - name: Run quality checks
      run: pixi run -e dev quality

    - name: Check version sync
      run: pixi run -e dev check-version-sync

  test:
    name: Test (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      OS: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.1
      with:
        environments: dev

    - name: Install dependencies
      run: pixi install --environment dev

    - name: Run tests with coverage
      run: pixi run -e dev test all

    - name: Upload coverage reports
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        env_vars: OS
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@v7
      with:
        files: ./junit.xml
        report_type: test_results
        flags: ${{ matrix.os }}
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  test-py313:
    name: Test (Python 3.13)
    needs: quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.1
      with:
        environments: dev-py313

    - name: Install dependencies
      run: pixi install --environment dev-py313

    - name: Run tests
      run: pixi run -e dev-py313 test all

  build:
    name: Build package
    needs: quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.10.1
      with:
        environments: dev

    - name: Install dependencies
      run: pixi install --environment dev

    - name: Build package
      run: pixi run -e dev build package

    - name: Check package
      run: pixi run -e dev build check

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 7
